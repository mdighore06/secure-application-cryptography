name: Security Gates (SAST & Supply Chain)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sast_scan:
    name: Run Automated Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep -r requirements.txt

      - name: Run Bandit SAST Step
        run: |
          # Scans recursively and fails build (non-zero exit) on Medium (-ll) or High severity findings
          bandit -r . -ll -v

      - name: Run Semgrep Python Scan (Additional Credit)
        run: |
          semgrep scan --config p/python .
